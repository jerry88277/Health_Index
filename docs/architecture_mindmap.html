<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health_Index 系統架構心智圖</title>
<style>
  :root{
    --bg:#0f172a; --panel:#111a2e; --ink:#e6edf7; --sub:#94a3b8; --line:#334155;
    --c1:#6366f1; --c2:#10b981; --c3:#f59e0b; --c4:#ef4444; --c5:#06b6d4;
    --c6:#a855f7; --c7:#ec4899; --c8:#84cc16;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
       background:radial-gradient(1200px 700px at 20% 0%,#152036,#0f172a);color:var(--ink);}
  header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;
         justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  header h1{margin:0;font-size:18px;font-weight:600;}
  header .hint{color:var(--sub);font-size:12.5px;}
  .wrap{display:flex;min-height:calc(100vh - 58px);}
  .map{flex:1;overflow:auto;padding:28px 24px;}
  /* Xmind 橫向樹 */
  ul.tree{list-style:none;margin:0;padding-left:26px;position:relative;}
  ul.tree.root{padding-left:0;}
  ul.tree li{position:relative;margin:5px 0;padding-left:22px;}
  ul.tree li::before{content:"";position:absolute;left:0;top:16px;width:18px;height:1px;background:var(--line);}
  ul.tree li::after{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--line);}
  ul.tree li:last-child::after{height:16px;}
  ul.tree.root>li{padding-left:0;}
  ul.tree.root>li::before,ul.tree.root>li::after{display:none;}
  .node{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;
        background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:13.5px;
        transition:transform .08s,box-shadow .12s;white-space:nowrap;}
  .node:hover{transform:translateX(2px);box-shadow:0 3px 14px rgba(0,0,0,.35);}
  .node .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .node .tog{color:var(--sub);font-size:11px;width:10px;text-align:center;}
  .node.root{font-size:16px;font-weight:600;padding:11px 18px;
             background:linear-gradient(135deg,#1e293b,#0b1220);border-color:#3b4a63;}
  .node.leaf{border-style:dashed;}
  .node .info{color:var(--sub);font-size:10px;border:1px solid var(--line);border-radius:6px;padding:0 5px;}
  li.collapsed>ul{display:none;}
  /* 詳細面板 */
  .detail{width:360px;flex:none;border-left:1px solid var(--line);background:#0c1424;
          padding:18px 20px;overflow:auto;position:sticky;top:0;height:calc(100vh - 58px);}
  .detail h2{margin:0 0 4px;font-size:15px;}
  .detail .tag{display:inline-block;font-size:11px;color:#0b1220;padding:2px 9px;border-radius:999px;font-weight:600;margin-bottom:10px;}
  .detail .body{font-size:13px;line-height:1.65;color:#cdd8ea;}
  .detail .body code{background:#1b2740;padding:1px 5px;border-radius:5px;color:#a5d6ff;font-size:12px;}
  .detail .body ul{padding-left:18px;margin:6px 0;}
  .detail .empty{color:var(--sub);font-size:13px;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:4px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  @media(max-width:820px){.detail{display:none;}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🧭 Health_Index 系統架構心智圖</h1>
    <div class="hint">AVM 精神的泛化工連續製程隱性飄移偵測 · 點節點展開/收合 · 點虛線葉節點看詳細</div>
  </div>
  <div class="legend" id="legend"></div>
</header>
<div class="wrap">
  <div class="map"><ul class="tree root" id="root"></ul></div>
  <div class="detail" id="detail"><div class="empty">← 點左側任一節點看說明；虛線框（葉節點）有詳細資訊。</div></div>
</div>

<script>
const C={ctx:"var(--c1)",data:"var(--c5)",pre:"var(--c3)",det:"var(--c4)",
         fuse:"var(--c2)",feat:"var(--c6)",dep:"var(--c8)",ui:"var(--c7)"};

// 資料樹：name≤10字；leaf 的 detail 為詳細 HTML
const TREE={name:"健康度偵測系統",root:true,color:"var(--c1)",children:[
 {name:"專案初衷",color:C.ctx,children:[
   {name:"要解的問題",color:C.ctx,leaf:true,detail:`同一產線跑 A→換 B/C 或停機維修→回頭跑 A 時，A 有沒有<b>隱性飄移</b>。<br>「隱性」＝每個感測器都在規格內、但<b>多變量關係或 X→Y 映射已偏</b>，單變數 SPC 抓不到。`},
   {name:"AVM 精神",color:C.ctx,leaf:true,detail:`取成大鄭芳田教授 AVM（自動虛擬量測）精神：以<b>虛擬量測 Ŷ</b>取代破壞性/昂貴抽樣，並在預測不可信時<b>提前預警</b>。`},
   {name:"成功判準",color:C.ctx,leaf:true,detail:`<ul><li>golden-A 期間維持低分（健康）</li><li>對「每變數在規格內」的隱性多變量飄移，<b>早於單變數 SPC</b> 升高</li><li>能區分「乾淨換線後 A 正常回歸」vs「A 回歸但殘留飄移」</li></ul>`}
 ]},
 {name:"資料契約",color:C.data,children:[
   {name:"interface.py",color:C.data,leaf:true,detail:`<b>統一資料契約（骨架，不動）。</b><br>不變式：<b>每列＝一個 timestamp 樣本</b>。<br>RAW 必填：<code>timestamp / grade_label / y_value / y_timestamp</code>。<br>衍生：<code>campaign_id / mode / run_id / is_golden_a / y_delay</code>。<br><code>ProcessDataset(frame, x_columns, name)</code>。`},
   {name:"資料源",color:C.data,children:[
     {name:"TEP",color:C.data,leaf:true,detail:`Tennessee Eastman：<b>含 CSTR 反應器的整廠連續製程</b>。X＝xmeas01–22（流量/溫度/壓力/液位）；<b>Y＝產品 G/H 莫耳%</b>（稀疏化驗，接 Y 側維度）。tep/tep_tp 兩變體（iid 重抽 / 保時序）。`},
     {name:"其他公開集",color:C.data,leaf:true,detail:`CCPP（發電）、Steel（能耗）、synthetic（合成隱性飄移）、UCI gas、penicillin/IndPenSim（批次）。`},
     {name:"泛用/現場",color:C.data,leaf:true,detail:`<code>DataFrame adapter</code>：任意表＋欄位角色映射即接入（免寫 adapter）。<code>PISource</code>：PI Historian stub（NOT VERIFIED，現場填實）。`}
   ]}
 ]},
 {name:"前處理",color:C.pre,children:[
   {name:"分段對齊",color:C.pre,leaf:true,detail:`<code>preprocess/segment.py</code>：由 grade 導 campaign、PELT 變點、穩態 pseudo-run、transition settling 排除。<code>align.py</code>：X→Y 延遲估計。<code>seg_ramp/seg_std</code> 共用穩態準則。`},
   {name:"特徵建構層",color:C.feat,children:[
     {name:"段定義",color:C.feat,leaf:true,detail:`<code>features.py</code>：三分段法——<b>trim</b>（去頭尾取中間，預設）、<b>ssd</b>（PELT-on-raw+ramp/std）、<b>wavelet</b>（PELT-on-高頻能量，抓振盪）。`},
     {name:"段統計",color:C.feat,leaf:true,detail:`每段算 [參數×統計] 6 量（mean/std/min/max/range/median）；count 為段級 metadata、mode 連續退化不入。`},
     {name:"偏離視圖",color:C.feat,leaf:true,detail:`golden window-vs-window <b>block-bootstrap</b> null → z + Holm 校正 + chance band。<b>is_advisory＝非告警</b>（可解釋視圖；主訊號仍 L2 SPE）。`}
   ]}
 ]},
 {name:"五維判斷鏈",color:C.det,children:[
   {name:"L1 資料效度",color:C.det,leaf:true,detail:`<code>DQI_x</code>：FastMCD 穩健距離閘。感測器凍結/斷訊/超界→資料不可信就先擋，避免髒資料汙染下游。`},
   {name:"L2 多變量",color:C.det,leaf:true,detail:`<b>隱性飄移主訊號。</b> PCA→<code>T²</code>（域內 Mahalanobis）、<code>SPE/Q</code>（<b>離流形殘差＝關係斷</b>）、GSI、<code>RBC</code> 肇因定位。<br>單點就能算（逐樣本）——每值在規格內但組合離流形→ SPE 飆。`},
   {name:"L3 軟測量",color:C.det,leaf:true,detail:`<code>soft_sensor/y_health</code>：GPR 預測 Ŷ + split-conformal 可信度（in-sample 近似、非嚴格保證）。<b>map</b>＝X→Y 殘差健康；<b>dist</b>＝多維 Y-MSPC；<b>Ŷ-drift</b>＝預測品質水準漂移（外推時標不可信）。`},
   {name:"L4 分布漂移",color:C.det,leaf:true,detail:`<code>drift.py</code>：PCA 分數空間；KS first-pass→MMD 確認；<b>Wasserstein</b> 量級（對 golden null 標準化）；連續資料走 <b>block-bootstrap</b>（吸自相關）。需一個分布（多筆）。`},
   {name:"L5 批次軌跡",color:C.det,leaf:true,detail:`<code>batch_dtw</code>：DTW 軌跡對齊（penicillin/IndPenSim）+ Sakoe-Chiba band 限成本。連續穩態不適用（誠實標）。`}
 ]},
 {name:"融合決策",color:C.fuse,children:[
   {name:"health.py",color:C.fuse,leaf:true,detail:`各層 0–1 子分數（1=健康，方向統一）→ 加權 <b>Health Index</b>（L1/L2/L4）。<code>hard_gates</code> 硬閘安全網。<code>confidence</code>＝T² 域相似度（判讀可信度）。`},
   {name:"單一決策點",color:C.fuse,leaf:true,detail:`<code>fwer_alarm</code>：各層對 golden null 尾機率→<b>Holm 校正</b>→FWER≤α（golden 誤報率受控）。<code>alarm()</code>＝is_alarm ∨ fwer_alarm 聯集。`},
   {name:"re-entry 觸發",color:C.fuse,leaf:true,detail:`偵測「換產品（非 A）後第一段 A」重點監看；維修型 re-entry 待 maintenance 資料（誠實標未實作）。`}
 ]},
 {name:"部署層",color:C.dep,children:[
   {name:"模型打包",color:C.dep,leaf:true,detail:`<code>bundle.py</code>：joblib + <b>指紋重放</b>（載入重算比對，版本漂移即拒載）。存 <code>window</code>（評分窗長單一真相，A20）、config、golden 指紋、y_health。`},
   {name:"事件閉環",color:C.dep,leaf:true,detail:`<code>events.py</code>：偵測→認領→關閉（MTTR、處置留痕、稽核）。severity 依健康+可信+<b>層一致數</b>（A19）；process/quality 分流；close 時區穩健、append-on-closed。`},
   {name:"驗收 gate",color:C.dep,leaf:true,detail:`<code>acceptance.py</code>：hold-out golden 上量 <b>FPR</b>（硬擋）+ <b>recall</b>（警告）+ SPC 盲 + Y 側 FPR。使用者選段附 <b>p-hacking 揭露</b>（A10）。`},
   {name:"ROI/registry",color:C.dep,leaf:true,detail:`<code>roi.py</code>：效益估算，分母限已關閉真實處置（A17）。<code>assets/registry</code>：製程/模型 registry（版本、軟刪除、熱插拔、稽核）。<code>runner</code>：線上重放評分。`}
 ]},
 {name:"前端 UI",color:C.ui,children:[
   {name:"新建精靈",color:C.ui,leaf:true,detail:`<code>demo_app.py</code>（Dash）：選資料源+特徵子集 → golden（連續/勾選/自動）+ 預覽圖 → 測試+窗長 → 建模驗收 → 完成。`},
   {name:"健康結果",color:C.ui,leaf:true,detail:`健康指標時間線（區域色帶）、門檻 what-if、點窗<b>下鑽</b>（GSI/T²/SPE/RBC/p-value，customdata 帶 [start,win] 不錯位）、Ŷ vs 實際 Y 子圖、匯出口徑一致。`},
   {name:"段分析",color:C.ui,leaf:true,detail:`<b>可解釋視圖（非告警）</b>：段定義（trim/ssd/wavelet）+ [參數×統計] 偏離排序（Holm、三態、橙 banner）。與告警隔離防誤用。`},
   {name:"事件/總覽",color:C.ui,leaf:true,detail:`事件頁（認領/關閉/MTTR/ROI/「N 層一致」）、全廠總覽三態燈（健康/告警/待建模）、製程歷史稽核。`}
 ]}
]};

const legend=[["初衷","var(--c1)"],["資料","var(--c5)"],["前處理","var(--c3)"],["特徵層","var(--c6)"],
  ["五維鏈","var(--c4)"],["融合","var(--c2)"],["部署","var(--c8)"],["前端","var(--c7)"]];
document.getElementById("legend").innerHTML=legend.map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join("");

const detail=document.getElementById("detail");
function showDetail(n){
  detail.innerHTML=`<span class="tag" style="background:${n.color||'#6366f1'}">${n.leaf?'詳細節點':'分支'}</span>
    <h2>${n.name}</h2><div class="body">${n.detail||'（此為分支節點，點展開子節點；葉節點才有詳細資訊）'}</div>`;
}
function render(node){
  const li=document.createElement("li");
  const el=document.createElement("div");
  const hasKids=node.children&&node.children.length;
  el.className="node"+(node.root?" root":"")+(node.leaf?" leaf":"");
  el.innerHTML=(hasKids?`<span class="tog">▸</span>`:"")+
    `<span class="dot" style="background:${node.color||'#6366f1'}"></span>${node.name}`+
    (node.leaf?`<span class="info">i</span>`:"");
  el.onclick=(e)=>{e.stopPropagation();
    if(hasKids){li.classList.toggle("collapsed");
      const t=el.querySelector(".tog");if(t)t.textContent=li.classList.contains("collapsed")?"▸":"▾";}
    showDetail(node);};
  li.appendChild(el);
  if(hasKids){
    const ul=document.createElement("ul");ul.className="tree";
    node.children.forEach(c=>ul.appendChild(render(c)));
    li.appendChild(ul);
    el.querySelector(".tog").textContent="▾";
  }
  return li;
}
document.getElementById("root").appendChild(render(TREE));
</script>
</body>
</html>
